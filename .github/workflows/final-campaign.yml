name: final-thesis-campaign

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/final-campaign.yml'
      - 'config/final_campaign.yaml'
      - 'tools/run_thesis_pipeline.py'
      - 'tools/finalize_campaign.py'
      - 'simulations/**'
      - 'src/**'
      - 'data/reference/**'
      - 'requirements.txt'

jobs:
  campaign:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      PYTHONPATH: .
      MPLBACKEND: Agg
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests before full campaign
        run: python -m pytest -q
      - name: Run full registered thesis campaign
        run: python -m tools.run_thesis_pipeline
      - name: Download verified simultaneous AMOVFLY public pair
        run: |
          mkdir -p data/external/amovfly
          curl -fL 'https://raw.githubusercontent.com/YujiaoHu/AMOVFLY-Dataset/main/FAFS/FAFS/UavY_P0A10S6_1.csv' -o data/external/amovfly/UavY_P0A10S6_1.csv
          curl -fL 'https://raw.githubusercontent.com/YujiaoHu/AMOVFLY-Dataset/main/FAVS/FAVS/UavR_P0A40VarS8_1.csv' -o data/external/amovfly/UavR_P0A40VarS8_1.csv
      - name: Run canonical measured-mobility pair analysis
        run: |
          python -m simulations.real_mobility_pair \
            --uav1-file data/external/amovfly/UavY_P0A10S6_1.csv --uav1-time '2024/11/21 13:50' \
            --uav2-file data/external/amovfly/UavR_P0A40VarS8_1.csv --uav2-time '2024/11/21 13:46'
      - name: Finalize and scientifically audit campaign
        run: python -m tools.finalize_campaign
      - name: Upload canonical campaign evidence
        uses: actions/upload-artifact@v4
        with:
          name: final-thesis-campaign-${{ github.sha }}
          path: |
            results/final_campaign/
            figures/final_campaign/
            results/reproducibility/
            results/real_mobility_pair/
            figures/mobility/
          if-no-files-found: error
          retention-days: 90
