name: scientific-ci

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: pytest -q
      - name: Smoke-test measured baseline
        run: python -m src.measured_a2a_baseline
      - name: Smoke-test channel comparison
        run: python -m simulations.channel_comparison
