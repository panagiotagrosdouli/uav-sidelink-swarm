name: scientific-ci

on:
  push:
    branches: [main, "feature/**", "paper/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PYTHONPATH: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run unit tests
        run: python -m pytest -q
      - name: Smoke-test measured baseline
        run: python -m src.measured_a2a_baseline
      - name: Smoke-test channel comparison
        run: python -m simulations.channel_comparison
      - name: Smoke-test density study
        run: python -m simulations.density_measurement_based
      - name: Smoke-test scaling geometry and activity
        run: python -m simulations.scaling_geometry_activity_study --smoke
      - name: Smoke-test resource allocation
        run: python -m simulations.resource_allocation_study
      - name: Smoke-test routing
        run: python -m simulations.routing_study --smoke
      - name: Smoke-test directionality sensitivity
        run: python -m simulations.beamforming_sensitivity --smoke
      - name: Smoke-test ULA directionality
        run: python -m simulations.ula_directionality_study --smoke
      - name: Smoke-test robustness sensitivity
        run: python -m simulations.robustness_sensitivity --smoke
      - name: Smoke-test NR MCS/BLER link performance
        run: python -m simulations.nr_link_performance_study
      - name: Smoke-test TBS/CBS/HARQ latency study
        run: python -m simulations.harq_tbs_latency_study
      - name: Smoke-test sidelink overhead sensitivity
        run: python -m simulations.sidelink_overhead_sensitivity
      - name: Smoke-test traffic load
        run: python -m simulations.traffic_load_study --smoke
      - name: Smoke-test failure analysis
        run: python -m simulations.failure_analysis --smoke
      - name: Smoke-test spatial diagnostics
        run: python -m simulations.spatial_diagnostics --smoke
      - name: Smoke-test synthetic mobility
        run: python -m simulations.synthetic_mobility_study --smoke
      - name: Smoke-test ablation
        run: python -m simulations.ablation_study --smoke
      - name: Smoke-test paper operating envelope
        run: python -m simulations.paper_operating_envelope --smoke
      - name: Validate reproducible thesis registry
        run: python -m tools.run_thesis_pipeline --dry-run --smoke
      - name: Validate final campaign config/finalizer syntax
        run: python -m py_compile tools/finalize_campaign.py tools/prepare_5glena_v5_bler.py src/sidelink/adaptive_tb.py simulations/paper_operating_envelope.py
      - name: Upload scientific outputs
        uses: actions/upload-artifact@v4
        with:
          name: thesis-scientific-outputs-${{ github.sha }}
          path: |
            results/
            figures/
          if-no-files-found: warn
